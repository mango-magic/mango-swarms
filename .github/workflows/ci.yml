name: Portable toolkit checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, CLI, installer and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q mango_swarms scripts launch.py
      - name: Public source audit
        run: python scripts/audit_public.py
      - name: Documented macOS and Linux setup
        if: runner.os != 'Windows'
        run: |
          bash install.sh
          ./bin/swarm-gpt --dry-run
      - name: Documented Windows setup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\install.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\swarm-gpt.cmd --dry-run
          exit $LASTEXITCODE
